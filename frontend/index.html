<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mercado App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Username Modal -->
  <div id="username-modal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <h2>Willkommen!</h2>
      <p>Gib deinen Namen ein und wähle einen Avatar.</p>
      <input type="text" id="username-input" placeholder="Dein Name" maxlength="50" />
      <div class="avatar-grid">
        <button class="avatar-option" onclick="waehleAvatar(this,'🍎')">🍎</button>
        <button class="avatar-option" onclick="waehleAvatar(this,'🍊')">🍊</button>
        <button class="avatar-option" onclick="waehleAvatar(this,'🍋')">🍋</button>
        <button class="avatar-option" onclick="waehleAvatar(this,'🍇')">🍇</button>
        <button class="avatar-option" onclick="waehleAvatar(this,'🍓')">🍓</button>
        <button class="avatar-option" onclick="waehleAvatar(this,'🍑')">🍑</button>
        <button class="avatar-option" onclick="waehleAvatar(this,'🍒')">🍒</button>
        <button class="avatar-option" onclick="waehleAvatar(this,'🍌')">🍌</button>
        <button class="avatar-option" onclick="waehleAvatar(this,'🍍')">🍍</button>
        <button class="avatar-option" onclick="waehleAvatar(this,'🥭')">🥭</button>
        <button class="avatar-option" onclick="waehleAvatar(this,'🍉')">🍉</button>
        <button class="avatar-option" onclick="waehleAvatar(this,'🫐')">🫐</button>
        <button class="avatar-option" onclick="waehleAvatar(this,'🍐')">🍐</button>
        <button class="avatar-option" onclick="waehleAvatar(this,'🥝')">🥝</button>
        <button class="avatar-option" onclick="waehleAvatar(this,'🍈')">🍈</button>
        <button class="avatar-option" onclick="waehleAvatar(this,'🍏')">🍏</button>
      </div>
      <button onclick="speichereUsername()">Loslegen</button>
    </div>
  </div>

  <div class="container">
    <div class="top-bar">
      <div onclick="goHome()" style="cursor:pointer;">
        <h1>Mercado App</h1>
        <p style="font-size:13px; color:#64748b; margin-top:2px;">Supermarkt Preisvergleich</p>
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        <button class="wishlist-nav-btn" onclick="zeigeWunschliste()" id="wishlist-nav-btn">Wunschliste</button>
        <button class="wishlist-nav-btn" onclick="zeigeEinkaufsliste()" id="einkauf-nav-btn" style="border-color:rgba(74,222,128,0.4); color:#4ade80; background:rgba(74,222,128,0.08);">Einkaufsliste</button>
        <div class="avatar-container" id="avatar-container" style="display:none;">
          <div class="avatar-bubble" id="avatar-bubble" onclick="toggleAvatarMenu()"></div>
          <div class="avatar-tooltip" id="avatar-tooltip"></div>
          <div class="avatar-menu" id="avatar-menu" style="display:none;">
            <div class="avatar-menu-name" id="avatar-menu-name"></div>
            <button onclick="ausloggen()">Ausloggen</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Suchbox -->
    <div class="suchbox">
      <input type="text" id="suchbegriff" placeholder="Produkt eingeben, z.B. Mango" />
      <div style="display:flex; align-items:center; gap:6px; flex-shrink:0;">
        <input type="text" id="plz" placeholder="PLZ" value="72555" style="max-width: 100px;" />
        <button class="info-btn" onclick="toggleInfo(event, 'Die Postleitzahl bestimmt, welche regionalen Angebote angezeigt werden. Händler ohne Eintrag für diese PLZ erscheinen nicht in den Ergebnissen.')">?</button>
      </div>
      <button onclick="suchen()" id="such-button">Suchen</button>
    </div>

    <!-- Filter bar -->
    <div id="filter-bar" style="display:none;"></div>

    <!-- Suchergebnisse -->
    <div id="ergebnisse"></div>

    <!-- Wunschliste -->
    <div id="wunschliste-section" style="display:none;">
      <div class="verlauf-header">
        <span>Wunschliste von <span id="wunschliste-username"></span></span>
        <button id="verlauf-close" onclick="schliesseWunschliste()">✕</button>
      </div>
      <input class="listen-suchfeld" id="wunschliste-suche" type="text" placeholder="Suche in der Wunschliste..." oninput="filterWunschliste()" />
      <div id="wunschliste-inhalt"></div>
    </div>

    <!-- Einkaufsliste -->
    <div id="einkaufsliste-section" style="display:none;">
      <div class="verlauf-header">
        <span>Einkaufsliste von <span id="einkaufsliste-username"></span></span>
        <button onclick="schliesseEinkaufsliste()">✕</button>
      </div>
      <input class="listen-suchfeld" id="einkaufsliste-suche" type="text" placeholder="Suche in der Einkaufsliste..." oninput="filterEinkaufsliste()" />
      <div id="einkaufsliste-inhalt"></div>
    </div>
  </div>

  <!-- Preisverlauf -->
  <div id="verlauf-section" style="display:none;">
    <div class="verlauf-header">
      <span id="verlauf-titel"></span>
      <button id="verlauf-close" onclick="schliesseVerlauf()">✕</button>
    </div>
    <div class="verlauf-chart-box">
      <canvas id="verlaufChart"></canvas>
    </div>
    <p id="verlauf-status" class="status"></p>
  </div>

  <div id="info-popover"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="script.js"></script>
</body>
</html>

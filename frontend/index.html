<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supermarkt Preisvergleich</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Username Modal -->
  <div id="username-modal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <h2>👋 Willkommen!</h2>
      <p>Gib deinen Namen ein, damit wir deine Wunschliste speichern können.</p>
      <input type="text" id="username-input" placeholder="Dein Name" maxlength="50" />
      <button onclick="speichereUsername()">Loslegen</button>
    </div>
  </div>

  <div class="container">
    <div class="top-bar">
      <h1 onclick="goHome()" style="cursor:pointer;">🛒 Supermarkt Preisvergleich</h1>
      <button class="wishlist-nav-btn" onclick="zeigeWunschliste()" id="wishlist-nav-btn">❤️ Wunschliste</button>
    </div>

    <!-- Suchbox -->
    <div class="suchbox">
      <input type="text" id="suchbegriff" placeholder="Produkt eingeben, z.B. Mango" />
      <input type="text" id="plz" placeholder="PLZ" value="72555" style="max-width: 100px;" />
      <button onclick="suchen()" id="such-button">Suchen</button>
    </div>

    <!-- Filter bar -->
    <div id="filter-bar" style="display:none;"></div>

    <!-- Suchergebnisse -->
    <div id="ergebnisse"></div>

    <!-- Wunschliste -->
    <div id="wunschliste-section" style="display:none;">
      <div class="verlauf-header">
        <span>❤️ Wunschliste von <span id="wunschliste-username"></span></span>
        <button id="verlauf-close" onclick="schliesseWunschliste()">✕</button>
      </div>
      <div id="wunschliste-inhalt"></div>
    </div>
  </div>

  <!-- Preisverlauf -->
  <div id="verlauf-section" style="display:none;">
    <div class="verlauf-header">
      <span id="verlauf-titel"></span>
      <button id="verlauf-close" onclick="schliesseVerlauf()">✕</button>
    </div>
    <div class="verlauf-chart-box">
      <canvas id="verlaufChart"></canvas>
    </div>
    <p id="verlauf-status" class="status"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supermarkt Preisvergleich</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>🛒 Supermarkt Preisvergleich</h1>

    <!-- Das ist die Suchbox -->
    <div class="suchbox">
      <input
        type="text"
        id="suchbegriff"
        placeholder="Produkt eingeben, z.B. Mango"
        onkeydown="if(event.key==='Enter') suchen()"
      />
      <input
        type="text"
        id="plz"
        placeholder="PLZ"
        value="72555"
        style="max-width: 100px;"
        onkeydown="if(event.key==='Enter') suchen()"
      />
      <button onclick="suchen()" id="such-button">Suchen</button>
    </div>

    <!-- Filter bar (erscheint nach der Suche) -->
    <div id="filter-bar" style="display:none;"></div>

    <!-- Hier erscheinen die Ergebnisse -->
    <div id="ergebnisse"></div>
  </div>

  <!-- History chart section -->
  <div id="verlauf-section" style="display:none;">
    <div class="verlauf-header">
      <span id="verlauf-titel"></span>
      <button id="verlauf-close" onclick="schliesseVerlauf()">✕</button>
    </div>
    <div class="verlauf-chart-box">
      <canvas id="verlaufChart"></canvas>
    </div>
    <p id="verlauf-status" class="status"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supermarkt Preisvergleich</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>🛒 Supermarkt Preisvergleich</h1>

    <!-- Das ist die Suchbox -->
    <div class="suchbox">
      <input
        type="text"
        id="suchbegriff"
        placeholder="Produkt eingeben, z.B. Mango"
        onkeydown="if(event.key==='Enter') suchen()"
      />
      <input
        type="text"
        id="plz"
        placeholder="PLZ"
        value="72555"
        style="max-width: 100px;"
        onkeydown="if(event.key==='Enter') suchen()"
      />
      <button onclick="suchen()" id="such-button">Suchen</button>
    </div>

    <!-- Hier erscheinen die Ergebnisse -->
    <div id="ergebnisse"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>

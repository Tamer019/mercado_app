<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Admin - Originalpreise verwalten</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(30, 41, 59, 0.6);
            border-radius: 12px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(74, 222, 128, 0.2);
        }
        th {
            color: #4ade80;
        }
        form {
            background: rgba(30, 41, 59, 0.8);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        input, button {
            margin: 5px;
            padding: 8px;
        }
        .delete-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
        }
        #syncBtn {
            background: #4ade80;
            color: black;
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        #syncBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .sync-box {
            background: rgba(74, 222, 128, 0.1);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<div class="admin-container">
    <h1>Admin: Originalpreise verwalten</h1>
    
    <form id="loginForm" style="display: block;">
        <h2>Login</h2>
        <input type="text" id="username" placeholder="Benutzername" required>
        <input type="password" id="password" placeholder="Passwort" required>
        <button type="submit">Einloggen</button>
    </form>

    <div id="adminContent" style="display: none;">
        <div style="background: rgba(74, 222, 128, 0.1); padding: 15px; border-radius: 12px; margin-bottom: 20px;">
        <h3>OldPrice Sync</h3>
        <button id="syncBtn" style="background: #4ade80; color: black; padding: 8px 16px;">OldPrices aus API übernehmen</button>
        <span id="syncStatus" style="margin-left: 10px;"></span>
        </div>

        <form id="priceForm">
            <h2>Neuen Preis hinzufügen / bearbeiten</h2>
            <input type="text" id="produkt_name" placeholder="Produktname" required>
            <input type="text" id="haendler" placeholder="Händler" required>
            <input type="text" id="plz" placeholder="PLZ" value="72555" required>
            <input type="number" id="preis" step="0.01" placeholder="Preis" required>
            <button type="submit">Speichern</button>
        </form>

        <h2>Vorhandene Preise</h2>
        <div style="margin-bottom: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
            <input type="text" id="searchInput" placeholder="Suche nach Produkt, Händler oder PLZ..." oninput="filterTable()" style="flex:1; min-width: 200px;">
            <span id="searchCount" style="color: #94a3b8; font-size: 14px; white-space: nowrap;"></span>
        </div>
        <table id="preiseTable">
            <thead>
                <tr><th>ID</th><th>Produkt</th><th>Händler</th><th>PLZ</th><th>Preis</th><th>Quelle</th><th>Aktion</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
    const API_URL = 'https://mercado-app019.onrender.com';
    let authToken = null;

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        // Basic Auth Header bauen
        const credentials = btoa(`${username}:${password}`);

        try {
            const res = await fetch(`${API_URL}/admin/preise`, {
                headers: { 'Authorization': `Basic ${credentials}` }
            });
            if (res.ok) {
                authToken = credentials;
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('adminContent').style.display = 'block';
                loadPreise();
            } else {
                alert('Login fehlgeschlagen');
            }
        } catch(err) {
            alert('Server nicht erreichbar');
        }
    });

    async function loadPreise() {
        const res = await fetch(`${API_URL}/admin/preise`, {
            headers: { 'Authorization': `Basic ${authToken}` }
        });
        const data = await res.json();
        const tbody = document.querySelector('#preiseTable tbody');
        tbody.innerHTML = '';
        data.forEach(p => {
            const row = tbody.insertRow();
            row.insertCell(0).innerText = p.id;
            row.insertCell(1).innerText = p.produkt_name;
            row.insertCell(2).innerText = p.haendler;
            row.insertCell(3).innerText = p.plz;
            row.insertCell(4).innerText = p.preis + '€';
            row.insertCell(5).innerText = p.quelle;
            const deleteCell = row.insertCell(6);
            const deleteBtn = document.createElement('button');
            deleteBtn.innerText = 'Löschen';
            deleteBtn.className = 'delete-btn';
            deleteBtn.onclick = () => deletePreis(p.id);
            deleteCell.appendChild(deleteBtn);
        });
        filterTable();
    }

    function filterTable() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        const rows = document.querySelectorAll('#preiseTable tbody tr');
        let visible = 0;
        rows.forEach(row => {
            const match = row.innerText.toLowerCase().includes(term);
            row.style.display = match ? '' : 'none';
            if (match) visible++;
        });
        const countEl = document.getElementById('searchCount');
        countEl.textContent = term ? `${visible} von ${rows.length} Einträgen` : `${rows.length} Einträge`;
    }

    async function deletePreis(id) {
        if (confirm('Wirklich löschen?')) {
            await fetch(`${API_URL}/admin/preise/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Basic ${authToken}` }
            });
            loadPreise();
        }
    }

    document.getElementById('priceForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const produkt_name = document.getElementById('produkt_name').value;
        const haendler = document.getElementById('haendler').value;
        const plz = document.getElementById('plz').value;
        const preis = parseFloat(document.getElementById('preis').value);

        const params = new URLSearchParams({ produkt_name, haendler, plz, preis });
        await fetch(`${API_URL}/admin/preise?${params}`, {
            method: 'POST',
            headers: { 'Authorization': `Basic ${authToken}` }
        });
        loadPreise();
        document.getElementById('priceForm').reset();
    });

    // ========== 🟢 NEU: Sync-Button Funktion ==========
    document.getElementById('syncBtn').addEventListener('click', async () => {
        const syncBtn = document.getElementById('syncBtn');
        const syncStatus = document.getElementById('syncStatus');
        
        syncBtn.disabled = true;
        syncStatus.textContent = 'Sync läuft...';
        syncStatus.style.color = '#fbbf24';
        
        try {
            const res = await fetch(`${API_URL}/admin/sync-oldprices`, {
                method: 'POST',
                headers: { 'Authorization': `Basic ${authToken}` }
            });
            const data = await res.json();
            syncStatus.textContent = `${data.gespeichert} Preise gespeichert (${data.fehler} Fehler)`;
            syncStatus.style.color = '#4ade80';
            loadPreise();  // Tabelle neu laden
        } catch (err) {
            syncStatus.textContent = 'Fehler beim Sync';
            syncStatus.style.color = '#fb7185';
        } finally {
            syncBtn.disabled = false;
            setTimeout(() => { 
                syncStatus.textContent = '';
                syncStatus.style.color = '';
            }, 5000);
        }
    });
    // ========== ENDE NEU ==========
</script>
</body>
</html>

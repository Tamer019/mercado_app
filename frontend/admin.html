<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Admin - Originalpreise verwalten</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .kz-box {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(74, 222, 128, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            display: none;
        }
        .kz-kopf {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .kz-kopf input {
            flex: 1;
            min-width: 140px;
        }
        .kz-zeile {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .kz-zeile input {
            flex: 1;
            min-width: 120px;
            margin: 0;
        }
        .kz-remove-btn {
            background: rgba(239,68,68,0.15);
            color: #fb7185;
            border: 1px solid rgba(239,68,68,0.3);
            border-radius: 6px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 13px;
            flex-shrink: 0;
        }
        .kz-actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        .kz-add-btn {
            background: rgba(74,222,128,0.1);
            color: #4ade80;
            border: 1px solid rgba(74,222,128,0.3);
            border-radius: 6px;
            padding: 7px 14px;
            cursor: pointer;
            font-size: 13px;
        }
        .kz-save-btn {
            background: #4ade80;
            color: #0f1419;
            border: none;
            border-radius: 6px;
            padding: 7px 18px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
        }
        .kz-status {
            font-size: 13px;
            color: #94a3b8;
        }
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(30, 41, 59, 0.6);
            border-radius: 12px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(74, 222, 128, 0.2);
        }
        th {
            color: #4ade80;
        }
        form {
            background: rgba(30, 41, 59, 0.8);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        input, button {
            margin: 5px;
            padding: 8px;
        }
        .delete-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
        }
        #syncBtn {
            background: #4ade80;
            color: black;
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        #syncBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .sync-box {
            background: rgba(74, 222, 128, 0.1);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<div class="admin-container">
    <h1>Admin: Originalpreise verwalten</h1>
    
    <form id="loginForm" style="display: block;">
        <h2>Login</h2>
        <input type="text" id="username" placeholder="Benutzername" required>
        <input type="password" id="password" placeholder="Passwort" required>
        <button type="submit">Einloggen</button>
    </form>

    <div id="adminContent" style="display: none;">
        <div style="background: rgba(74, 222, 128, 0.1); padding: 15px; border-radius: 12px; margin-bottom: 20px;">
        <h3>OldPrice Sync</h3>
        <button id="syncBtn" style="background: #4ade80; color: black; padding: 8px 16px;">OldPrices aus API übernehmen</button>
        <span id="syncStatus" style="margin-left: 10px;"></span>
        </div>

        <div style="margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap;">
            <button onclick="toggleKassenzettel()" style="background: rgba(74,222,128,0.1); color: #4ade80; border: 1px solid rgba(74,222,128,0.3); border-radius: 8px; padding: 8px 18px; font-size: 14px; cursor: pointer;">
                Kassenzettel erfassen
            </button>
            <button onclick="toggleBenutzer()" style="background: rgba(96,165,250,0.1); color: #60a5fa; border: 1px solid rgba(96,165,250,0.3); border-radius: 8px; padding: 8px 18px; font-size: 14px; cursor: pointer;">
                Benutzer verwalten
            </button>
        </div>

        <!-- Benutzer-Verwaltung -->
        <div id="benutzerBox" style="display:none; background: rgba(30,41,59,0.8); border: 1px solid rgba(96,165,250,0.3); border-radius: 12px; padding: 20px; margin-bottom: 20px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h3 style="color: #60a5fa; margin: 0;">Benutzer &amp; Listen</h3>
                <button onclick="ladeBenutzer()" style="background: rgba(96,165,250,0.1); color: #60a5fa; border: 1px solid rgba(96,165,250,0.3); border-radius: 6px; padding: 5px 12px; font-size: 13px; cursor: pointer;">Aktualisieren</button>
            </div>
            <div id="benutzerListe"></div>

            <!-- Detail-Panel -->
            <div id="benutzerDetail" style="display:none; margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 16px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                    <h4 id="detailTitel" style="color: #e0e0e0; margin: 0;"></h4>
                    <button onclick="document.getElementById('benutzerDetail').style.display='none'" style="background: none; border: none; color: #64748b; font-size: 18px; cursor: pointer; padding: 0; box-shadow: none;">✕</button>
                </div>
                <div style="display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap;">
                    <button onclick="zeigeDetailTab('merkliste')" id="tab-merkliste" style="background: rgba(251,113,133,0.15); color: #fb7185; border: 1px solid rgba(251,113,133,0.4); border-radius: 6px; padding: 5px 14px; font-size: 13px; cursor: pointer;">Wunschliste</button>
                    <button onclick="zeigeDetailTab('einkaufsliste')" id="tab-einkaufsliste" style="background: rgba(74,222,128,0.08); color: #4ade80; border: 1px solid rgba(74,222,128,0.3); border-radius: 6px; padding: 5px 14px; font-size: 13px; cursor: pointer;">Einkaufsliste</button>
                </div>
                <div id="detailInhalt"></div>
            </div>
        </div>

        <div class="kz-box" id="kzBox">
            <h3 style="color: #4ade80; margin-bottom: 14px;">Kassenzettel erfassen</h3>
            <div class="kz-kopf">
                <input type="text" id="kz-haendler" placeholder="Händler (z.B. REWE)" />
                <input type="text" id="kz-plz" placeholder="PLZ" value="72555" style="max-width: 100px;" />
            </div>
            <div style="display: grid; grid-template-columns: 2fr 1fr 1fr 32px; gap: 8px; margin-bottom: 6px; padding: 0 2px;">
                <span style="font-size: 12px; color: #64748b;">Produkt</span>
                <span style="font-size: 12px; color: #64748b;">Normalpreis €</span>
                <span style="font-size: 12px; color: #64748b;">Angebotspreis €</span>
                <span></span>
            </div>
            <div id="kz-zeilen"></div>
            <div class="kz-actions">
                <button class="kz-add-btn" onclick="addKzZeile()">+ Zeile</button>
                <button class="kz-save-btn" onclick="speichereKassenzettel()">Alles speichern</button>
                <span class="kz-status" id="kz-status"></span>
            </div>
        </div>

        <form id="priceForm">
            <h2>Neuen Preis hinzufügen / bearbeiten</h2>
            <input type="text" id="produkt_name" placeholder="Produktname" required>
            <input type="text" id="haendler" placeholder="Händler" required>
            <input type="text" id="plz" placeholder="PLZ" value="72555" required>
            <input type="number" id="preis" step="0.01" placeholder="Preis" required>
            <button type="submit">Speichern</button>
        </form>

        <h2>Vorhandene Preise</h2>
        <div style="margin-bottom: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
            <input type="text" id="searchInput" placeholder="Suche nach Produkt, Händler oder PLZ..." oninput="filterTable()" style="flex:1; min-width: 200px;">
            <span id="searchCount" style="color: #94a3b8; font-size: 14px; white-space: nowrap;"></span>
        </div>
        <table id="preiseTable">
            <thead>
                <tr><th>ID</th><th>Produkt</th><th>Händler</th><th>PLZ</th><th>Preis</th><th>Quelle</th><th>Aktion</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
    const API_URL = 'https://mercado-app019.onrender.com';
    let authToken = null;

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        // Basic Auth Header bauen
        const credentials = btoa(`${username}:${password}`);

        try {
            const res = await fetch(`${API_URL}/admin/preise`, {
                headers: { 'Authorization': `Basic ${credentials}` }
            });
            if (res.ok) {
                authToken = credentials;
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('adminContent').style.display = 'block';
                loadPreise();
            } else {
                alert('Login fehlgeschlagen');
            }
        } catch(err) {
            alert('Server nicht erreichbar');
        }
    });

    async function loadPreise() {
        const res = await fetch(`${API_URL}/admin/preise`, {
            headers: { 'Authorization': `Basic ${authToken}` }
        });
        const data = await res.json();
        const tbody = document.querySelector('#preiseTable tbody');
        tbody.innerHTML = '';
        data.forEach(p => {
            const row = tbody.insertRow();
            row.insertCell(0).innerText = p.id;
            row.insertCell(1).innerText = p.produkt_name;
            row.insertCell(2).innerText = p.haendler;
            row.insertCell(3).innerText = p.plz;
            row.insertCell(4).innerText = p.preis + '€';
            row.insertCell(5).innerText = p.quelle;
            const deleteCell = row.insertCell(6);
            const deleteBtn = document.createElement('button');
            deleteBtn.innerText = 'Löschen';
            deleteBtn.className = 'delete-btn';
            deleteBtn.onclick = () => deletePreis(p.id);
            deleteCell.appendChild(deleteBtn);
        });
        filterTable();
    }

    function filterTable() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        const rows = document.querySelectorAll('#preiseTable tbody tr');
        let visible = 0;
        rows.forEach(row => {
            const match = row.innerText.toLowerCase().includes(term);
            row.style.display = match ? '' : 'none';
            if (match) visible++;
        });
        const countEl = document.getElementById('searchCount');
        countEl.textContent = term ? `${visible} von ${rows.length} Einträgen` : `${rows.length} Einträge`;
    }

    async function deletePreis(id) {
        if (confirm('Wirklich löschen?')) {
            await fetch(`${API_URL}/admin/preise/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Basic ${authToken}` }
            });
            loadPreise();
        }
    }

    document.getElementById('priceForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const produkt_name = document.getElementById('produkt_name').value;
        const haendler = document.getElementById('haendler').value;
        const plz = document.getElementById('plz').value;
        const preis = parseFloat(document.getElementById('preis').value);

        const params = new URLSearchParams({ produkt_name, haendler, plz, preis });
        await fetch(`${API_URL}/admin/preise?${params}`, {
            method: 'POST',
            headers: { 'Authorization': `Basic ${authToken}` }
        });
        loadPreise();
        document.getElementById('priceForm').reset();
    });

    // ========== Kassenzettel ==========
    function toggleKassenzettel() {
        const box = document.getElementById('kzBox');
        const offen = box.style.display === 'block';
        box.style.display = offen ? 'none' : 'block';
        if (!offen && document.querySelectorAll('.kz-zeile').length === 0) addKzZeile();
    }

    function addKzZeile() {
        const zeile = document.createElement('div');
        zeile.className = 'kz-zeile';
        zeile.innerHTML = `
            <input type="text" placeholder="Produktname" class="kz-produkt" />
            <input type="number" step="0.01" min="0" placeholder="optional" class="kz-normal" />
            <input type="number" step="0.01" min="0" placeholder="optional" class="kz-angebot" />
            <button class="kz-remove-btn" onclick="this.closest('.kz-zeile').remove()">✕</button>
        `;
        document.getElementById('kz-zeilen').appendChild(zeile);
        zeile.querySelector('.kz-produkt').focus();
    }

    async function speichereKassenzettel() {
        const haendler = document.getElementById('kz-haendler').value.trim();
        const plz      = document.getElementById('kz-plz').value.trim();
        const status   = document.getElementById('kz-status');

        if (!haendler || !plz) { status.textContent = 'Bitte Händler und PLZ ausfüllen.'; status.style.color = '#fb7185'; return; }

        const zeilen = document.querySelectorAll('.kz-zeile');
        const zuSpeichern = [];
        zeilen.forEach(z => {
            const produkt = z.querySelector('.kz-produkt').value.trim();
            const normal  = parseFloat(z.querySelector('.kz-normal').value);
            if (produkt && !isNaN(normal) && normal > 0) zuSpeichern.push({ produkt, preis: normal });
        });

        if (zuSpeichern.length === 0) { status.textContent = 'Keine Zeile mit Produkt + Normalpreis gefunden.'; status.style.color = '#fb7185'; return; }

        status.textContent = 'Speichere...'; status.style.color = '#fbbf24';

        let gespeichert = 0, fehler = 0;
        for (const item of zuSpeichern) {
            const params = new URLSearchParams({ produkt_name: item.produkt, haendler, plz, preis: item.preis });
            try {
                const res = await fetch(`${API_URL}/admin/preise?${params}`, {
                    method: 'POST', headers: { 'Authorization': `Basic ${authToken}` }
                });
                if (res.ok) gespeichert++; else fehler++;
            } catch { fehler++; }
        }

        status.textContent = `${gespeichert} gespeichert${fehler > 0 ? `, ${fehler} Fehler` : ''}`;
        status.style.color = fehler > 0 ? '#fbbf24' : '#4ade80';
        loadPreise();
    }
    // ========== ENDE Kassenzettel ==========

    // ========== Sync-Button Funktion ==========
    document.getElementById('syncBtn').addEventListener('click', async () => {
        const syncBtn = document.getElementById('syncBtn');
        const syncStatus = document.getElementById('syncStatus');
        
        syncBtn.disabled = true;
        syncStatus.textContent = 'Sync läuft...';
        syncStatus.style.color = '#fbbf24';
        
        try {
            const res = await fetch(`${API_URL}/admin/sync-oldprices`, {
                method: 'POST',
                headers: { 'Authorization': `Basic ${authToken}` }
            });
            const data = await res.json();
            syncStatus.textContent = `${data.gespeichert} Preise gespeichert (${data.fehler} Fehler)`;
            syncStatus.style.color = '#4ade80';
            loadPreise();  // Tabelle neu laden
        } catch (err) {
            syncStatus.textContent = 'Fehler beim Sync';
            syncStatus.style.color = '#fb7185';
        } finally {
            syncBtn.disabled = false;
            setTimeout(() => { 
                syncStatus.textContent = '';
                syncStatus.style.color = '';
            }, 5000);
        }
    });
    // ========== ENDE Sync ==========

    // ========== Benutzer-Verwaltung ==========
    let aktuellerBenutzer = null;
    let aktuellerTab = 'merkliste';

    function toggleBenutzer() {
        const box = document.getElementById('benutzerBox');
        const offen = box.style.display === 'block';
        box.style.display = offen ? 'none' : 'block';
        if (!offen) ladeBenutzer();
    }

    async function ladeBenutzer() {
        const el = document.getElementById('benutzerListe');
        el.innerHTML = '<p style="color:#94a3b8; font-size:14px;">Lade...</p>';
        try {
            const res = await fetch(`${API_URL}/admin/users`, {
                headers: { 'Authorization': `Basic ${authToken}` }
            });
            const users = await res.json();
            if (users.length === 0) {
                el.innerHTML = '<p style="color:#64748b; font-size:14px;">Keine Benutzer gefunden.</p>';
                return;
            }
            el.innerHTML = `
                <table style="width:100%; border-collapse:collapse;">
                    <thead>
                        <tr>
                            <th style="text-align:left; padding:10px 12px; color:#60a5fa; border-bottom:1px solid rgba(96,165,250,0.2);">Benutzer</th>
                            <th style="text-align:center; padding:10px 12px; color:#fb7185; border-bottom:1px solid rgba(96,165,250,0.2);">Wunschliste</th>
                            <th style="text-align:center; padding:10px 12px; color:#4ade80; border-bottom:1px solid rgba(96,165,250,0.2);">Einkaufsliste</th>
                            <th style="text-align:right; padding:10px 12px; border-bottom:1px solid rgba(96,165,250,0.2);">Aktionen</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${users.map(u => `
                            <tr style="border-bottom:1px solid rgba(255,255,255,0.05);">
                                <td style="padding:10px 12px;">
                                    <button onclick="zeigeBenutzerDetail('${u.username.replace(/'/g, "\\'")}')"
                                        style="background:none; border:none; color:#e0e0e0; font-size:14px; cursor:pointer; padding:0; box-shadow:none; text-align:left; text-decoration:underline; text-decoration-color:#64748b;">
                                        ${u.username}
                                    </button>
                                </td>
                                <td style="text-align:center; padding:10px 12px; color:#fb7185;">${u.merkliste_count}</td>
                                <td style="text-align:center; padding:10px 12px; color:#4ade80;">${u.einkauf_count}</td>
                                <td style="text-align:right; padding:10px 12px;">
                                    <div style="display:flex; gap:6px; justify-content:flex-end; flex-wrap:wrap;">
                                        <button onclick="loescheUserListe('${u.username.replace(/'/g, "\\'")}', 'merkliste')"
                                            style="background:rgba(251,113,133,0.1); color:#fb7185; border:1px solid rgba(251,113,133,0.3); border-radius:5px; padding:4px 10px; font-size:12px; cursor:pointer; box-shadow:none;">
                                            Wunschliste leeren
                                        </button>
                                        <button onclick="loescheUserListe('${u.username.replace(/'/g, "\\'")}', 'einkaufsliste')"
                                            style="background:rgba(74,222,128,0.08); color:#4ade80; border:1px solid rgba(74,222,128,0.2); border-radius:5px; padding:4px 10px; font-size:12px; cursor:pointer; box-shadow:none;">
                                            Einkaufsliste leeren
                                        </button>
                                        <button onclick="loescheAlleUserDaten('${u.username.replace(/'/g, "\\'")}')"
                                            style="background:rgba(239,68,68,0.1); color:#f87171; border:1px solid rgba(239,68,68,0.25); border-radius:5px; padding:4px 10px; font-size:12px; cursor:pointer; box-shadow:none;">
                                            Alles löschen
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        } catch {
            el.innerHTML = '<p style="color:#fb7185; font-size:14px;">Fehler beim Laden.</p>';
        }
    }

    async function zeigeBenutzerDetail(username) {
        aktuellerBenutzer = username;
        document.getElementById('detailTitel').textContent = username;
        document.getElementById('benutzerDetail').style.display = 'block';
        document.getElementById('benutzerDetail').scrollIntoView({ behavior: 'smooth' });
        zeigeDetailTab(aktuellerTab);
    }

    async function zeigeDetailTab(tab) {
        aktuellerTab = tab;
        const inhalt = document.getElementById('detailInhalt');
        inhalt.innerHTML = '<p style="color:#94a3b8; font-size:13px;">Lade...</p>';

        try {
            const res = await fetch(`${API_URL}/admin/users/${encodeURIComponent(aktuellerBenutzer)}/${tab}`, {
                headers: { 'Authorization': `Basic ${authToken}` }
            });
            const items = await res.json();

            if (items.length === 0) {
                inhalt.innerHTML = '<p style="color:#64748b; font-size:13px;">Keine Einträge.</p>';
                return;
            }

            if (tab === 'merkliste') {
                inhalt.innerHTML = items.map(i => `
                    <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 10px; background:rgba(15,20,25,0.4); border-radius:7px; margin-bottom:6px;">
                        <div>
                            <span style="color:#e0e0e0; font-size:13px; font-weight:500;">${i.suchbegriff}</span>
                            <span style="color:#4ade80; font-size:11px; margin-left:8px; opacity:0.7;">${i.plz}</span>
                        </div>
                        <span style="color:#475569; font-size:11px;">${new Date(i.gespeichert_am).toLocaleDateString('de-DE')}</span>
                    </div>
                `).join('');
            } else {
                inhalt.innerHTML = items.map(i => `
                    <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 10px; background:rgba(15,20,25,0.4); border-radius:7px; margin-bottom:6px;">
                        <div>
                            <span style="color:#e0e0e0; font-size:13px; font-weight:500;">${i.produkt_name}</span>
                            <span style="color:#94a3b8; font-size:11px; margin-left:8px;">${i.haendler} · ${i.preis?.toFixed(2)}€</span>
                        </div>
                        <span style="color:#475569; font-size:11px;">${i.plz}</span>
                    </div>
                `).join('');
            }
        } catch {
            inhalt.innerHTML = '<p style="color:#fb7185; font-size:13px;">Fehler beim Laden.</p>';
        }
    }

    async function loescheUserListe(username, liste) {
        const label = liste === 'merkliste' ? 'Wunschliste' : 'Einkaufsliste';
        if (!confirm(`${label} von "${username}" wirklich leeren?`)) return;
        await fetch(`${API_URL}/admin/users/${encodeURIComponent(username)}/${liste}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Basic ${authToken}` }
        });
        ladeBenutzer();
        if (aktuellerBenutzer === username) zeigeDetailTab(aktuellerTab);
    }

    async function loescheAlleUserDaten(username) {
        if (!confirm(`ALLE Daten von "${username}" löschen (Wunschliste + Einkaufsliste)?`)) return;
        await fetch(`${API_URL}/admin/users/${encodeURIComponent(username)}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Basic ${authToken}` }
        });
        document.getElementById('benutzerDetail').style.display = 'none';
        aktuellerBenutzer = null;
        ladeBenutzer();
    }
    // ========== ENDE Benutzer-Verwaltung ==========
</script>
</body>
</html>
